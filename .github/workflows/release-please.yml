name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and validate release automation
        working-directory: .github/release
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Update release PR or create release
        id: release
        working-directory: .github/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release

      - name: Check the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -er '.number' <<< "$RELEASE_PR")
          PR_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)
          gh workflow run android-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH"

      - name: Identify the release PR to merge
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --head release-please--branches--main --state open \
            --label 'autorelease: pending' --author 'app/github-actions' \
            --json number,headRefOid --jq '.[0] // empty')
          if [ -n "$PR" ]; then
            PR_NUMBER=$(jq -er '.number' <<< "$PR")
            FILES=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only)
            while IFS= read -r FILE; do
              case "$FILE" in
                version.txt|.release-please-manifest.json|CHANGELOG.md) ;;
                *) echo "::error::Unexpected file in release PR: $FILE"; exit 1 ;;
              esac
            done <<< "$FILES"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -er '.headRefOid' <<< "$PR")" >> "$GITHUB_OUTPUT"
          fi

  check-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr_number != ''
    uses: ./.github/workflows/android-ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.release-please.outputs.pr_sha }}

  merge-release-pr:
    needs: [release-please, check-release-pr]
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install release automation
        working-directory: .github/release
        run: npm ci
      - name: Merge the tested release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.release-please.outputs.pr_number }}
          PR_SHA: ${{ needs.release-please.outputs.pr_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$PR_SHA"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED
      - name: Create the release after merging
        id: release
        working-directory: .github/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release

  release-apk:
    needs: [release-please, merge-release-pr]
    if: >-
      always() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       needs.merge-release-pr.outputs.release_created == 'true')
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.merge-release-pr.outputs.tag_name || needs.release-please.outputs.tag_name }}
    secrets: inherit
