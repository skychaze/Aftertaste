name: Release APK

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or retry, or empty for an artifact-only build
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify release version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(tr -d '\r\n' < version.txt)
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.txt must contain major.minor.patch"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          if (( 10#$MAJOR > 999 || 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "::error::Version parts must be between 0 and 999"
            exit 1
          fi
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if [ "$VERSION_CODE" -eq 0 ]; then
            echo "::error::Android versionCode must be positive"
            exit 1
          fi
          test "$(jq -r '.["."]' .release-please-manifest.json)" = "$VERSION_NAME"
          if [ -n "$REQUESTED_TAG" ]; then
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::Release tags must point to a commit merged into main"
              exit 1
            }
            if [[ ! "$REQUESTED_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${REQUESTED_TAG#[vV]}" != "$VERSION_NAME" ]; then
              echo "::error::Tag $REQUESTED_TAG does not match version.txt $VERSION_NAME"
              exit 1
            fi
            TAG_NAME="$REQUESTED_TAG"
          else
            TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "TAG_NAME=$TAG_NAME"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Refuse to replace a published release
        if: inputs.tag != '' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Listing also distinguishes API/auth errors from a missing release.
          RELEASES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag_name,draft}')
          if jq -es --arg tag "$TAG_NAME" 'any(.[]; .tag_name == $tag and .draft == false)' <<< "$RELEASES" >/dev/null; then
            echo "::error::Release $TAG_NAME is already published. Never replace a public APK; prepare a new version."
            exit 1
          fi
          while IFS= read -r PUBLISHED_TAG; do
            if [[ "$PUBLISHED_TAG" =~ ^[vV]([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              PUBLISHED_CODE=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
              if (( VERSION_CODE <= PUBLISHED_CODE )); then
                echo "::error::Version must be newer than published $PUBLISHED_TAG"
                exit 1
              fi
            fi
          done < <(jq -rs '.[] | select(.draft == false) | .tag_name' <<< "$RELEASES")

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for a release build" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android checks
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug --stacktrace

      - name: Configure Last.fm API key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          if [ -z "$LASTFM_API_KEY" ]; then
            echo "LASTFM_API_KEY is required for genre lookup in the release APK" >&2
            exit 1
          fi
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > .env

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "aftertaste-v${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Verify APK identity
        run: |
          APK="aftertaste-v${VERSION_NAME}-${VERSION_CODE}.apk"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2=$(find "$SDK_DIR/build-tools" -type f -name aapt2 -perm -111 | sort -V | tail -n 1)
          if [ -z "$AAPT2" ]; then
            echo "aapt2 was not found under $SDK_DIR/build-tools" >&2
            exit 1
          fi
          BADGING=$("$AAPT2" dump badging "$APK")
          grep -Fq "package: name='com.aistudio.ytmtracker.mplayq' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" <<<"$BADGING"

      - name: Verify APK signature and expected signer
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          set -euo pipefail
          APK="aftertaste-v${VERSION_NAME}-${VERSION_CODE}.apk"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED=$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AfterTaste-${{ env.TAG_NAME }}
          path: aftertaste-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}.apk
          retention-days: 30

      - name: Attach APK and publish GitHub release
        if: inputs.tag != '' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="aftertaste-v${VERSION_NAME}-${VERSION_CODE}.apk"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "$APK" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "AfterTaste $TAG_NAME"
          fi
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" .env
