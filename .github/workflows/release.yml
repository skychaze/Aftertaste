# Builds a signed release APK every time you push a version tag (e.g. v1.2.3)
# and attaches it to the GitHub Release for that tag.
#
# Cutting a release:
#   git tag v1.2.3 && git push origin v1.2.3
# Or create a release in the GitHub UI, then push a matching tag.
#
# One-time setup for store-ready signatures (optional but recommended):
#   1. keytool -genkeypair -keystore my-upload-key.jks -alias upload \
#        -keyalg RSA -keysize 2048 -validity 10000
#   2. base64 -w0 my-upload-key.jks  (macOS: base64 -i my-upload-key.jks)
#   3. Repo Settings > Secrets and variables > Actions > New repository secret:
#        ANDROID_KEYSTORE_BASE64  = output of step 2
#        ANDROID_STORE_PASSWORD   = keystore password
#        ANDROID_KEY_ALIAS        = key alias (defaults to "upload")
#        ANDROID_KEY_PASSWORD     = key password
# Without these secrets the APK is still built but signed with debug keys,
# which is fine for sideloading but not for the Play Store.
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
            VERSION_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
            VERSION_NAME="1.0.0-manual.${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          # run_number grows monotonically, so it works as versionCode.
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $TAG_NAME (versionName=$VERSION_NAME versionCode=$GITHUB_RUN_NUMBER)"

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE" --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "AfterTaste-${TAG_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AfterTaste-${{ env.TAG_NAME }}
          path: AfterTaste-${{ env.TAG_NAME }}.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AfterTaste-${{ env.TAG_NAME }}.apk
          generate_release_notes: true
